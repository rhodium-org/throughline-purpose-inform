[project]
name = "Purpose — Inform (throughline source)"
format_version = 4

# A throughline *source*: a standalone graph a consuming project composes via
# throughline-compose, importing it under a namespace (e.g. `purpose`) and referencing
# principles as `purpose:UR-0001` or rules as `purpose:SR-0001`. The UIDs here are this
# source's own and immutable; the purpose + dimension reference lives in
# `attrs.source_ref`, never in the UID.
#
# This is the *genre / purpose* axis — what the writing is FOR, its communicative job —
# for ONE purpose: INFORM. It deliberately says nothing about readability, spelling,
# punctuation, tone/register, medium or brand voice; each of those is its own
# throughline source. Purpose variants are MUTUALLY EXCLUSIVE: inform, instruct and
# persuade are SIBLING sources and a consumer composes exactly one under the `purpose`
# namespace (swapping purpose is a one-line `url`/`ref` change). A page has one primary
# job; mixing purposes in one graph would merge rules that pull in different directions.
#
# The rules are original house content guidance, licensed under
# Apache-2.0; nothing here reproduces a third-party standard. Each principle is a
# `user_requirement`; each concrete rule is a `system_requirement` that `implements`
# its principle.

[grounding]
root_types = ["intent"]
delivery_roots = ["intent"]
ground_link_types = ["derives_from", "implements"]
ai_origins = ["ai", "hybrid"]

[types.user_requirement]
attrs.source_ref = { required = true }

[types.system_requirement]
attrs.source_ref = { required = true }

[links]
types = ["derives_from", "implements", "relates"]

[link_rules]
derives_from = { from = ["user_requirement"], to = ["intent"] }
implements   = { from = ["system_requirement"], to = ["user_requirement"] }

[status]
# Retired by `tl migrate` (SR-0313): draft, approved stood between proposal and
# signature. Every item is born proposed and counts only once a person signs it
# (UR-0046).
values = ["proposed", "deferred", "ratified", "implemented", "verified",
          "suspect", "rejected", "deleted"]

[transitions]
# `tl migrate` added the move to 'suspect' (SR-0188): this lifecycle gave
# 'proposed' no route to it, so an item resting in 'proposed' could never be
# marked suspect and invalidating anything it grounds in would have left it
# unflagged. Narrow it back deliberately with `tl schema transition deny
# proposed suspect`.
proposed = ["ratified", "deferred", "rejected", "deleted", "suspect"]
# `tl migrate` added the move to 'suspect' (SR-0188): this lifecycle gave
# 'deferred' no route to it, so an item resting in 'deferred' could never be
# marked suspect and invalidating anything it grounds in would have left it
# unflagged. Narrow it back deliberately with `tl schema transition deny
# deferred suspect`.
deferred = ["proposed", "rejected", "deleted", "suspect"]
ratified    = ["implemented", "suspect", "rejected", "deleted"]
implemented = ["verified", "suspect", "rejected", "deleted"]
verified    = ["implemented", "suspect", "deleted"]
suspect = ["proposed", "ratified", "implemented", "verified", "rejected",
           "deleted"]
rejected = ["proposed", "deleted"]

# `tl docs` regenerates docs/spec.md + README.md from the graph; `tl docs --check`
# gates them so the published counts and tables can never drift.
[docs]
paths = ["docs/*.md", "README.md"]

# Semantic status roles (SR-0131): which declared status
# plays each role the tool's operations act on. Backfilled by
# `tl migrate`; edit to match your own status vocabulary.
[status.roles]
initial = "proposed"
proposed = "proposed"
ratified = "ratified"
invalidated = "rejected"
suspect = "suspect"
tombstone = "deleted"
